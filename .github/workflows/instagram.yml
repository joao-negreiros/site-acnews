name: Postar no Instagram

# Chama o site a cada hora; o próprio site decide se está na hora de postar e qual matéria vai.
# Precisa do segredo CRON_SECRET (Settings > Secrets and variables > Actions). Sem ele, não faz nada.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o site
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET não configurado; nada a fazer."; exit 0; fi
          curl -sS --fail-with-body --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "https://www.acnewsnet.com.br/api/instagram/postar"
